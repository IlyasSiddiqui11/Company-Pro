spring.application.name=employee-management-system

# ==============================================================
# Neon PostgreSQL Datasource Configuration
# ==============================================================
# Supports full JDBC URL (DB_URL / DATABASE_URL) or individual connection properties
spring.datasource.url=${DB_URL:${DATABASE_URL:jdbc:postgresql://${DB_HOST:ep-fragrant-moon-azowvvjs-pooler.c-3.ap-southeast-1.aws.neon.tech}:${DB_PORT:5432}/${DB_NAME:neondb}?sslmode=${DB_SSLMODE:require}}}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME:${DATABASE_USERNAME:neondb_owner}}
spring.datasource.password=${DB_PASSWORD:${DATABASE_PASSWORD:}}

# HikariCP Connection Pool (Optimized for Neon Serverless & PgBouncer connection pooling)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

# Hibernate and JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# H2 Console (Disabled when running PostgreSQL)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Application Port (Compatible with Render's dynamic $PORT)
server.port=${PORT:${SERVER_PORT:8080}}

# Static Resources Serving
spring.web.resources.static-locations=file:../frontend/,file:./frontend/,classpath:/static/
spring.mvc.static-path-pattern=/**
