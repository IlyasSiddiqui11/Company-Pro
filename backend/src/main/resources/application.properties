spring.application.name=employee-management-system

# ==============================================================
# Neon PostgreSQL Datasource Configuration
# ==============================================================
# You can supply DB_URL directly, or individual parameters:
# DB_HOST, DB_PORT, DB_NAME, DB_USERNAME, DB_PASSWORD, DB_SSLMODE
# Default sslmode for Neon DB is "require"
spring.datasource.url=${DB_URL}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}

# HikariCP Connection Pool (Optimized for Neon Serverless & PgBouncer connection pooling)
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:10}
spring.datasource.hikari.minimum-idle=${DB_MIN_IDLE:2}
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.max-lifetime=600000
spring.datasource.hikari.connection-timeout=30000
spring.datasource.hikari.keepalive-time=30000

# Hibernate and JPA
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:update}
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=${JPA_FORMAT_SQL:false}
spring.jpa.open-in-view=false

# H2 Console (Disabled when running PostgreSQL)
spring.h2.console.enabled=${H2_CONSOLE_ENABLED:false}
spring.h2.console.path=/h2-console
spring.h2.console.settings.web-allow-others=false

# Application Port
server.port=${SERVER_PORT:8080}

# Static Resources Serving
spring.web.resources.static-locations=file:../frontend/,file:./frontend/,classpath:/static/
spring.mvc.static-path-pattern=/**
